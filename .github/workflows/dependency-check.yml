name: Reusable Dependency Check

on:
  workflow_call:
    inputs:
      trigger-event:
        description: Original caller event name
        required: false
        type: string
        default: workflow_dispatch
      java-version:
        description: Java version for scan runtime
        required: false
        type: string
        default: "21"
      gradle-task:
        description: Gradle task to run, or auto for fallback detection
        required: false
        type: string
        default: "auto"
      upload-reports:
        description: Upload dependency-check HTML/XML/JSON artifacts
        required: false
        type: boolean
        default: false
      fail-on-missing-task:
        description: Fail when dependency-check task not present
        required: false
        type: boolean
        default: false
      clone-flowdigger-gradle:
        description: Clone flowdigger-gradle when consumer uses includeBuild("../flowdigger-gradle")
        required: false
        type: boolean
        default: false
      flowdigger-gradle-ref:
        description: Ref to checkout for flowdigger-gradle composite build
        required: false
        type: string
        default: "main"
      fallback-owner:
        description: Fallback owner/org if clone from caller owner fails
        required: false
        type: string
        default: "flowdigger"
permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Evaluate dependency-check gate
        id: dc-gate
        shell: bash
        env:
          G_DEPENDENCY_CHECK: ${{ vars.G_DEPENDENCY_CHECK }}
        run: |
          value="$(printf '%s' "${G_DEPENDENCY_CHECK:-}" | tr '[:upper:]' '[:lower:]')"
          case "${value}" in
            "" | "yes")
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            "no")
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Invalid vars.G_DEPENDENCY_CHECK value: '${G_DEPENDENCY_CHECK}'. Expected 'yes' or 'no'."
              exit 1
              ;;
          esac
          echo "normalized=${value:-<unset>}" >> "$GITHUB_OUTPUT"

      - name: Dependency-check disabled summary
        if: steps.dc-gate.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "### OWASP Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skipped by vars.G_DEPENDENCY_CHECK=\`${{ steps.dc-gate.outputs.normalized }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- Set vars.G_DEPENDENCY_CHECK to \`yes\` to re-enable scan." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.dc-gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Clone flowdigger-gradle for composite build
        if: steps.dc-gate.outputs.enabled == 'true' && inputs.clone-flowdigger-gradle
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -R -q 'includeBuild("../flowdigger-gradle")\|includeBuild('\''../flowdigger-gradle'\'')' settings.gradle* 2>/dev/null; then
            echo "No flowdigger-gradle includeBuild reference found; skipping clone."
            exit 0
          fi

          ROOT_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          TARGET_DIR="$ROOT_PARENT/flowdigger-gradle"
          PRIMARY_OWNER="${GITHUB_REPOSITORY_OWNER}"
          FALLBACK_OWNER="${{ inputs.fallback-owner }}"
          REF="${{ inputs.flowdigger-gradle-ref }}"

          if [ -d "$TARGET_DIR/.git" ]; then
            echo "flowdigger-gradle already present at $TARGET_DIR"
            exit 0
          fi

          if git clone --depth 1 --branch "$REF" "https://github.com/$PRIMARY_OWNER/flowdigger-gradle.git" "$TARGET_DIR"; then
            echo "Cloned flowdigger-gradle from $PRIMARY_OWNER at ref $REF"
            exit 0
          fi

          git clone --depth 1 --branch "$REF" "https://github.com/$FALLBACK_OWNER/flowdigger-gradle.git" "$TARGET_DIR"
          echo "Cloned flowdigger-gradle from $FALLBACK_OWNER at ref $REF"

      - name: Setup Java
        if: steps.dc-gate.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        if: steps.dc-gate.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Fail fast on legacy dependency-check report DSL
        if: steps.dc-gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          legacy_hits="$(grep -R -n -E "format[[:space:]]*=[[:space:]]*['\"]HTML,[[:space:]]*JSON,[[:space:]]*XML['\"]" \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            . || true)"

          if [ -z "${legacy_hits}" ]; then
            exit 0
          fi

          {
            echo "### OWASP Dependency-Check configuration error"
            echo "- Detected legacy report DSL pattern incompatible with dependency-check v13:"
            echo ""
            echo "\`\`\`"
            echo "${legacy_hits}"
            echo "\`\`\`"
            echo ""
            echo "Replace:"
            echo "\`format = 'HTML,JSON,XML'\`"
            echo "with:"
            echo "\`formats = ['HTML', 'JSON', 'XML']\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Legacy dependency-check DSL detected; failing fast with actionable guidance."
          exit 1

      - name: Compute cache key suffix
        id: week
        if: steps.dc-gate.outputs.enabled == 'true'
        shell: bash
        run: echo "value=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache dependency-check NVD data
        id: dc-cache
        if: steps.dc-gate.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ steps.week.outputs.value }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Resolve dependency-check task
        id: dc-task
        if: steps.dc-gate.outputs.enabled == 'true'
        shell: bash
        run: |
          requested_task="${{ inputs.gradle-task }}"
          if [ "${requested_task}" != "auto" ]; then
            echo "value=${requested_task}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ./gradlew -q tasks --all | grep -q "dependencyCheckAnalyze"; then
            echo "value=dependencyCheckAnalyze" >> "$GITHUB_OUTPUT"
          elif ./gradlew -q tasks --all | grep -q "dependencyCheck$"; then
            echo "value=dependencyCheck" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.fail-on-missing-task }}" = "true" ]; then
              echo "No dependency-check task configured."
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nightly DB update
        if: steps.dc-gate.outputs.enabled == 'true' && inputs.trigger-event == 'schedule' && steps.dc-task.outputs.skip != 'true'
        shell: bash
        run: |
          gradle_args=(dependencyCheckUpdate)
          if [ -n "${NVD_API_KEY}" ]; then
            gradle_args+=("-Porg.owasp.dependencycheck.nvd.api.key=${NVD_API_KEY}")
          fi
          ./gradlew "${gradle_args[@]}"

      - name: Run dependency check
        id: dc-run
        if: steps.dc-gate.outputs.enabled == 'true' && steps.dc-task.outputs.skip != 'true'
        shell: bash
        run: |
          gradle_args=("${{ steps.dc-task.outputs.value }}")
          use_no_update=false
          if [ "${{ inputs.trigger-event }}" = "pull_request" ] && [ "${{ steps.dc-cache.outputs.cache-hit }}" = "true" ]; then
            init_file="${RUNNER_TEMP}/dependency-check-noupdate.init.gradle"
            printf '%s\n' \
              "allprojects {" \
              "  plugins.withId('org.owasp.dependencycheck') {" \
              "    dependencyCheck {" \
              "      autoUpdate = false" \
              "    }" \
              "  }" \
              "}" > "${init_file}"
            gradle_args+=("-I" "${init_file}")
            use_no_update=true
          fi
          echo "no_update=${use_no_update}" >> "$GITHUB_OUTPUT"
          if [ -n "${NVD_API_KEY}" ]; then
            gradle_args+=("-Porg.owasp.dependencycheck.nvd.api.key=${NVD_API_KEY}")
          fi

          max_attempts=2
          attempt=1
          while true; do
            if ./gradlew "${gradle_args[@]}"; then
              break
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Dependency-check run summary
        if: always() && steps.dc-gate.outputs.enabled == 'true' && steps.dc-task.outputs.skip != 'true'
        shell: bash
        run: |
          echo "### OWASP Dependency-Check run details" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle task: \`${{ steps.dc-task.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache hit: \`${{ steps.dc-cache.outputs.cache-hit || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR no-update mode: \`${{ steps.dc-run.outputs.no_update || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.trigger-event }}" = "pull_request" ] && [ "${{ steps.dc-cache.outputs.cache-hit }}" != "true" ]; then
            echo "- Cache miss on PR: running with updates enabled for stability." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dependency-check report on failure
        if: failure() && steps.dc-gate.outputs.enabled == 'true' && steps.dc-task.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-on-failure
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore

      - name: Missing dependency-check task summary
        if: steps.dc-gate.outputs.enabled == 'true' && steps.dc-task.outputs.skip == 'true'
        shell: bash
        run: |
          echo "### OWASP Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- No dependency-check task configured; scan skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency-check HTML report
        if: always() && steps.dc-gate.outputs.enabled == 'true' && inputs.upload-reports && steps.dc-task.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-html
          path: build/reports/dependency-check-report.html

      - name: Upload dependency-check XML report
        if: always() && steps.dc-gate.outputs.enabled == 'true' && inputs.upload-reports && steps.dc-task.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-xml
          path: build/reports/dependency-check-report.xml

      - name: Upload dependency-check JSON report
        if: always() && steps.dc-gate.outputs.enabled == 'true' && inputs.upload-reports && steps.dc-task.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-json
          path: build/reports/dependency-check-report.json

      - name: Dependency-check summary
        if: always() && steps.dc-gate.outputs.enabled == 'true' && inputs.upload-reports && steps.dc-task.outputs.skip != 'true'
        shell: bash
        run: |
          echo "### OWASP Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reports uploaded as workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
