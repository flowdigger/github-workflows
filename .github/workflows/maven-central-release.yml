name: Reusable Maven Central Release

on:
  workflow_call:
    inputs:
      trigger-event:
        description: Original caller event name
        required: false
        type: string
        default: workflow_dispatch
      java-version:
        description: Java version for build/publish runtime
        required: false
        type: string
        default: "21"
      verify-task:
        description: Gradle task(s) for release branch verification
        required: false
        type: string
        default: "clean test"
      publish-task:
        description: Gradle task(s) that produce Maven Central bundle
        required: false
        type: string
        default: "clean packageCentralBundle"
      central-namespace:
        description: Maven Central namespace for publisher upload
        required: false
        type: string
        default: "org.flowdigger"
      bundle-glob:
        description: Glob for generated Central bundle zip
        required: false
        type: string
        default: "build/central-bundle/*.zip"
      clone-composite-build-deps:
        description: Clone known includeBuild dependencies before running Gradle
        required: false
        type: boolean
        default: true
      fallback-owner:
        description: Fallback GitHub owner/org when dependency clone from caller owner fails
        required: false
        type: string
        default: "flowdigger"
      upload-artifacts:
        description: Upload publish logs and Central API response artifacts
        required: false
        type: boolean
        default: true
      publish-snapshot-branches:
        description: Enable snapshot publish on matching push branches
        required: false
        type: boolean
        default: false
      snapshot-branch-prefix:
        description: Branch ref prefix to trigger snapshot publish (for example refs/heads/snapshot/)
        required: false
        type: string
        default: "refs/heads/snapshot/"
      snapshot-publish-task:
        description: Gradle task(s) for snapshot publish testing
        required: false
        type: string
        default: "clean publish"
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      SIGNING_KEY:
        required: false
      SIGNING_PASSWORD:
        required: false
      SIGNING_KEY_ID:
        required: false

permissions:
  contents: read

jobs:
  verify-release-branch:
    if: inputs.trigger-event == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Ensure composite build dependencies are available
        if: inputs.clone-composite-build-deps
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          FALLBACK_OWNER="${{ inputs.fallback-owner }}"

          clone_if_referenced() {
            local includeExpr="$1"
            local repoName="$2"
            if ! grep -R -q "$includeExpr" settings.gradle* 2>/dev/null; then
              return 0
            fi
            if [ -d "$ROOT_PARENT/$repoName/.git" ]; then
              return 0
            fi
            if git clone --depth 1 "https://github.com/$OWNER/$repoName.git" "$ROOT_PARENT/$repoName"; then
              return 0
            fi
            git clone --depth 1 "https://github.com/$FALLBACK_OWNER/$repoName.git" "$ROOT_PARENT/$repoName"
          }

          clone_if_referenced 'includeBuild("../gradle-antlr-plugin")\|includeBuild('\''../gradle-antlr-plugin'\'')' gradle-antlr-plugin
          clone_if_referenced 'includeBuild("../gradle-antlr-parse-plugin")\|includeBuild('\''../gradle-antlr-parse-plugin'\'')' gradle-antlr-parse-plugin

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Verify release branch build
        shell: bash
        run: |
          set -euo pipefail
          read -r -a verify_tasks <<< "${{ inputs.verify-task }}"
          ./gradlew "${verify_tasks[@]}" --stacktrace --no-daemon

  publish:
    if: inputs.trigger-event == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (inputs.publish-snapshot-branches && inputs.trigger-event == 'push' && startsWith(github.ref, inputs.snapshot-branch-prefix))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Ensure composite build dependencies are available
        if: inputs.clone-composite-build-deps
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          FALLBACK_OWNER="${{ inputs.fallback-owner }}"

          clone_if_referenced() {
            local includeExpr="$1"
            local repoName="$2"
            if ! grep -R -q "$includeExpr" settings.gradle* 2>/dev/null; then
              return 0
            fi
            if [ -d "$ROOT_PARENT/$repoName/.git" ]; then
              return 0
            fi
            if git clone --depth 1 "https://github.com/$OWNER/$repoName.git" "$ROOT_PARENT/$repoName"; then
              return 0
            fi
            git clone --depth 1 "https://github.com/$FALLBACK_OWNER/$repoName.git" "$ROOT_PARENT/$repoName"
          }

          clone_if_referenced 'includeBuild("../gradle-antlr-plugin")\|includeBuild('\''../gradle-antlr-plugin'\'')' gradle-antlr-plugin
          clone_if_referenced 'includeBuild("../gradle-antlr-parse-plugin")\|includeBuild('\''../gradle-antlr-parse-plugin'\'')' gradle-antlr-parse-plugin

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Determine publish mode
        id: publish-mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.trigger-event }}" = "push" ] && [[ "${GITHUB_REF}" == "${{ inputs.snapshot-branch-prefix }}"* ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
            echo "task=${{ inputs.snapshot-publish-task }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
            echo "task=${{ inputs.publish-task }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve signing key id
        id: signing-env
        shell: bash
        run: |
          set -euo pipefail
          signing_key_id="$(printf '%s' '${{ secrets.SIGNING_KEY_ID }}' | tr -d '\r\n[:space:]')"
          signing_key_id_derived=false

          if [ -n "$signing_key_id" ]; then
            signing_key_id="${signing_key_id#0x}"
            signing_key_id="${signing_key_id#0X}"
            signing_key_id="${signing_key_id^^}"

            if [[ "$signing_key_id" =~ ^[0-9A-F]+$ ]] && [ "${#signing_key_id}" -gt 8 ]; then
              signing_key_id="${signing_key_id: -8}"
              signing_key_id_derived=true
            fi

            if [[ ! "$signing_key_id" =~ ^[0-9A-F]{8}$ ]]; then
              echo "::error::SIGNING_KEY_ID invalid after normalization. Expected 8 hex chars (optional 0x prefix), or longer fingerprint/key id ending with 8-char key id."
              exit 1
            fi
          fi

          if [ -n "$signing_key_id" ]; then
            echo "has_signing_key_id=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing_key_id=false" >> "$GITHUB_OUTPUT"
          fi
          echo "signing_key_id=$signing_key_id" >> "$GITHUB_OUTPUT"
          echo "signing_key_id_derived=$signing_key_id_derived" >> "$GITHUB_OUTPUT"

      - name: Preflight publish task graph
        if: steps.publish-mode.outputs.is_snapshot != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ steps.signing-env.outputs.signing_key_id }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a publish_tasks <<< "${{ steps.publish-mode.outputs.task }}"
          ./gradlew "${publish_tasks[@]}" --dry-run --stacktrace --no-daemon --console=plain | tee publish-preflight.log

          if ! grep -Eq '^:sign[A-Za-z0-9]+Publication\b' publish-preflight.log; then
            echo "Expected sign*Publication task(s) in publish task graph, but none were found."
            exit 1
          fi

      - name: Build signed artifacts and bundle
        if: steps.publish-mode.outputs.is_snapshot != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ steps.signing-env.outputs.signing_key_id }}
        shell: bash
        run: |
          set -euo pipefail
          for v in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingKey ORG_GRADLE_PROJECT_signingPassword; do
            if [ -z "${!v:-}" ]; then
              echo "Required secret missing: $v"
              exit 1
            fi
          done

          read -r -a publish_tasks <<< "${{ steps.publish-mode.outputs.task }}"
          ./gradlew "${publish_tasks[@]}" --stacktrace --no-daemon --info | tee publish.log

      - name: Publish snapshot artifacts
        if: steps.publish-mode.outputs.is_snapshot == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ steps.signing-env.outputs.signing_key_id }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a publish_tasks <<< "${{ steps.publish-mode.outputs.task }}"
          ./gradlew "${publish_tasks[@]}" --stacktrace --no-daemon --info | tee publish.log

      - name: Upload bundle to Central Publisher API
        if: steps.publish-mode.outputs.is_snapshot != 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=( ${{ inputs.bundle-glob }} )
          shopt -u nullglob
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "Bundle not found for glob: ${{ inputs.bundle-glob }}"
            exit 1
          fi
          BUNDLE_PATH="${bundles[0]}"

          TMP_DIR="$(mktemp -d)"
          unzip -q "$BUNDLE_PATH" -d "$TMP_DIR"
          find "$TMP_DIR" -type f ! -name '*.md5' ! -name '*.sha1' -print0 | while IFS= read -r -d '' f; do
            md5sum "$f" | awk '{print $1}' > "$f.md5"
            sha1sum "$f" | awk '{print $1}' > "$f.sha1"
          done
          rm -f "$BUNDLE_PATH"
          (
            cd "$TMP_DIR"
            zip -qr "$OLDPWD/$BUNDLE_PATH" .
          )
          rm -rf "$TMP_DIR"

          curl --fail-with-body -sS -u "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" \
            -X POST "https://central.sonatype.com/api/v1/publisher/upload?nameSpace=${{ inputs.central-namespace }}&publishingType=AUTOMATIC" \
            -F "bundle=@$BUNDLE_PATH" | tee central-upload-response.json

      - name: Upload publish log
        if: ${{ always() && inputs.upload-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: publish-log-${{ github.run_id }}
          path: publish.log
          if-no-files-found: warn

      - name: Upload Central response
        if: ${{ always() && inputs.upload-artifacts && steps.publish-mode.outputs.is_snapshot != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: central-response-${{ github.run_id }}
          path: central-upload-response.json
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo "### Maven publish mode" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.publish-mode.outputs.is_snapshot }}" = "true" ]; then
            echo "- Mode: snapshot" >> "$GITHUB_STEP_SUMMARY"
            echo "- Task: \`${{ steps.publish-mode.outputs.task }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Branch: \`${GITHUB_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Mode: release" >> "$GITHUB_STEP_SUMMARY"
            echo "- Task: \`${{ steps.publish-mode.outputs.task }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.signing-env.outputs.has_signing_key_id }}" = "true" ]; then
            if [ "${{ steps.signing-env.outputs.signing_key_id_derived }}" = "true" ]; then
              echo "- Signing key id: derived from provided fingerprint" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Signing key id: provided" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- Signing key id: not provided (Gradle fallback)" >> "$GITHUB_STEP_SUMMARY"
          fi
